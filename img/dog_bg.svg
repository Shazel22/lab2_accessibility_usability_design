<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice">
  <!-- Decorative background for MPLS Dog Boarding: soft lavender sky, rolling hills, scattered paw prints -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6f8"/>
      <stop offset="1" stop-color="#fbf3ea"/>
    </linearGradient>
    <g id="paw" fill="#d9c6ec">
      <ellipse cx="20" cy="27" rx="8" ry="6"/>
      <circle cx="11" cy="17" r="3.2"/>
      <circle cx="17" cy="11" r="3.2"/>
      <circle cx="24" cy="11" r="3.2"/>
      <circle cx="30" cy="17" r="3.2"/>
    </g>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1020" cy="140" r="70" fill="#fde3c4"/>
  <path d="M0 560 Q300 470 600 540 T1200 520 V800 H0Z" fill="#dcebd3"/>
  <path d="M0 640 Q350 570 700 630 T1200 610 V800 H0Z" fill="#c9e0bd"/>
  <use href="#paw" transform="translate(80 120) rotate(-20) scale(1.6)"/>
  <use href="#paw" transform="translate(190 210) rotate(-5) scale(1.6)"/>
  <use href="#paw" transform="translate(300 140) rotate(-25) scale(1.6)"/>
  <use href="#paw" transform="translate(420 240) rotate(-10) scale(1.6)"/>
  <use href="#paw" transform="translate(700 90) rotate(15) scale(1.4)"/>
  <use href="#paw" transform="translate(820 180) rotate(25) scale(1.4)"/>
  <use href="#paw" transform="translate(900 330) rotate(10) scale(1.4)"/>
  <use href="#paw" transform="translate(150 420) rotate(-15) scale(1.3)"/>
  <use href="#paw" transform="translate(560 380) rotate(5) scale(1.3)"/>
  <use href="#paw" transform="translate(1080 420) rotate(-8) scale(1.3)"/>
</svg>
